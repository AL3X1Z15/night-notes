</style></head><body><div id="app"><header><div><div class="brand">Night Notes</div><h1 id="heading">Tonight</h1></div><div class="moon" id="moon">☾</div></header><main id="main"></main><div class="foot">NIGHT NOTES · ON YOUR DEVICE</div></div><nav id="nav" aria-label="Main navigation"></nav><script>
'use strict';
const $=id=>document.getElementById(id),main=$('main'),KEY='night-notes-v3';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const fromKey=k=>new Date(k+'T12:00:00');
function shift(k,n){let d=fromKey(k);d.setDate(d.getDate()+n);return dateKey(d)}function monthShift(k,n){let d=fromKey(k);d.setDate(1);d.setMonth(d.getMonth()+n);return dateKey(d)}
function nightKey(){let d=new Date();if(d.getHours()>=18)d.setDate(d.getDate()+1);return dateKey(d)}
function localTime(d=new Date()){return dateKey(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}function pretty(k,opt={weekday:'long',month:'long',day:'numeric'}){return fromKey(k).toLocaleDateString('en-CA',opt)}
function time(s){return s&&Number.isFinite(new Date(s).getTime())?new Date(s).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit',hour12:true}):'Not recorded'}function diff(a,b){if(!a||!b)return null;let d=(new Date(b)-new Date(a))/60000;return Number.isFinite(d)&&d>=0&&d<=2880?Math.round(d):null}

const spec=[['mag','Magnesium','◒','time','Evening',1,1],['snack','Snack','♧','time','Evening',1,1],['scroll','Scrolling','▯','timer','Evening',1],['tv','TV / movies','▣','timer','Evening',1],['bed','Got into bed','▱','time','Evening',1],['attempt','Attempting sleep','☾','time','Evening',1],['interrupt','Night interruption','∿','interrupt','Anytime',1,1],['wake','Final wake-up','☀','time','Anytime',1],['sleep','Fell asleep (estimated)','☾','time','Morning',1],['quality','Sleep quality','☆','rating','Morning',1],['rest','Restedness','☀','rating','Morning',1],['out','Got out of bed','↗','time','Morning',0],['meal','Last meal','♧','time','Evening',0],['cannabis','Cannabis','◒','time','Evening',0,1],['caffeine','Caffeine','♨','time','Anytime',0,1],['nap','Nap','☁','timer','Anytime',0],['exercise','Exercise','↟','time','Anytime',0,1],['stretch','Morning stretching','↟','choice','Morning',0],['cycle','Menstrual cycle','○','text','Morning',0],['stress','Stress','∿','rating','Anytime',0],['dream','Dreams','✧','text','Morning',0],['environment','Sleep environment','⌂','text','Evening',0]];
const built=spec.map(([id,name,ico,type,place,on,repeat])=>({id,name,ico,type,place,on:!!on,repeat:!!repeat}));const fresh=()=>({version:3,records:{},trackers:built.map(t=>({...t})),theme:'Auto',accent:'#b5a5d8',lastExport:null});
let state=fresh(),storageOK=false;try{let raw=localStorage.getItem(KEY);if(raw){let v=JSON.parse(raw);if(valid(v))state=v}localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){}
let demo=null,tab=new Date().getHours()>=6&&new Date().getHours()<12?'Morning':'Home',selected=nightKey(),period='Daily',metric='sleep',expanded=new Set(),recap=false,createOpen=false,backupOpen=false,restoreOpen=false,message='';
const db=()=>demo||state;function persist(){if(demo)return;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false}let el=$('storage-warning');if(el)el.hidden=storageOK}
function record(k=selected,create=false){let r=db().records[k];if(!r&&create)r=db().records[k]={fields:{},notes:''};return r||{fields:{},notes:''}}
function field(id,k=selected,create=false){let r=record(k,create);if(!r.fields[id]&&create)r.fields[id]={};return r.fields[id]||{}}
const events=f=>Array.isArray(f.events)?f.events:[];const at=(id,k=selected)=>events(field(id,k)).find(e=>e.at)?.at||null;const trackBy=id=>db().trackers.find(t=>t.id===id);const active=()=>db().trackers.filter(t=>t.on);
const quality=v=>v==null?'Not recorded':v<20?'Terrible':v<40?'Poor':v<50?'Below decent':v<60?'Decent':v<75?'Decently good':v<90?'Good':'Wonderful';const rested=v=>v==null?'Not recorded':v<20?'Exhausted':v<40?'Tired':v<60?'Somewhat rested':v<85?'Well rested':'Refreshed';
function timerMinutes(f){if(num(f.minutes)!==null)return num(f.minutes);let a=events(f).filter(e=>e.at&&e.end).map(e=>diff(e.at,e.end)).filter(x=>x!==null);return a.length?a.reduce((x,y)=>x+y,0):f.status==='No'?0:null}
function interruption(k){let f=field('interrupt',k);if(f.status==='None')return {count:0,minutes:0};let n=num(f.count),logged=events(f).filter(e=>e.at).length;return {count:n??(logged||null),minutes:num(f.minutes)}}
function stats(k){let bed=at('bed',k),attempt=at('attempt',k),sleep=at('sleep',k),wake=at('wake',k),out=at('out',k),intr=interruption(k),window=diff(sleep,wake),awake=intr.minutes;return {sleep:window!==null&&awake!==null&&awake<=window?window-awake:null,window,bed:diff(bed,out),bedwake:diff(bed,wake),latency:diff(attempt,sleep),quality:num(field('quality',k).value),rest:num(field('rest',k).value),interrupt:intr.count,awake,scroll:timerMinutes(field('scroll',k)),tv:timerMinutes(field('tv',k))}}
function summary(t,f,k=selected){let es=events(f).filter(e=>e.at);if(t.type==='rating'){let v=num(f.value);return t.id==='quality'?quality(v):t.id==='rest'?rested(v):v===null?'Not recorded':v+'/100'}if(['choice','number','text','multi'].includes(t.type))return f.value!=null&&f.value!==''?String(f.value):'Not recorded';if(t.type==='interrupt'){let i=interruption(k);return f.status==='None'?'None':f.status==='Unsure'?'Possibly / unsure':i.count!==null?i.count+' recorded'+(i.minutes!==null?' · '+dur(i.minutes)+' awake':''):f.status==='Yes'?'Yes, count unknown':'Not recorded'}if(t.type==='timer'){let live=es.find(e=>!e.end);if(live)return 'Running since '+time(live.at);let n=timerMinutes(f);return n!==null?dur(n):f.status||'Not recorded'}return es.length?es.map(e=>(e.approx?'~':'')+time(e.at)).join(' · '):f.status||'Not recorded'}
const paths={Home:'<path d="m3 10 9-7 9 7v10h-6v-7H9v7H3z"/>',Morning:'<path d="M2 18h20M4 22h16M6 15a6 6 0 0 1 12 0M12 2v4M3 8l3 3m15-3-3 3"/>',Stats:'<rect x="4" y="13" width="3" height="7" rx="1"/><rect x="10" y="8" width="3" height="12" rx="1"/><rect x="16" y="3" width="3" height="17" rx="1"/>',Journal:'<path d="M12 5C8 2 4 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-4-2-7-1-10 1zM12 5v15"/>',Settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>'};
function btn(label,act,id='',cls='secondary'){return `<button class="${cls}" data-act="${act}" data-id="${esc(id)}">${esc(label)}</button>`}function datebar(label){return `<div class="datebar"><button data-act="prev" aria-label="Previous">‹</button><div class="center"><strong>${esc(label||pretty(selected,{weekday:'short',month:'short',day:'numeric'}))}</strong>${['Home','Morning'].includes(tab)?'<div class="muted small">Night ending on this date</div>':''}</div><button data-act="next" aria-label="Next">›</button></div>`}
function input(t,p,type='text',placeholder=''){return `<input type="${type}" data-field="${t.id}" data-prop="${p}" ${type==='number'?'min="0" step="any"':''} value="${esc(field(t.id)[p]??'')}" placeholder="${esc(placeholder)}">`}
function select(t,p,options,v){return `<select data-field="${t.id}" data-prop="${p}">${options.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o||'Not recorded')}</option>`).join('')}</select>`}const box=(label,html)=>`<div class="field"><label>${esc(label)}</label>${html}</div>`;

function detail(t,f){let s='',es=events(f);if(['time','timer','interrupt'].includes(t.type)){if(t.type==='interrupt'){s+=box('Interruptions',select(t,'status',['','None','Yes','Unsure'],f.status||''));s+=`<div class="row"><div class="flex">${box('Number (optional)',input(t,'count','number','Unknown'))}</div><div class="flex">${box('Total minutes awake',input(t,'minutes','number','Unknown'))}</div></div>`}else if(!es.length)s+=box('Status',select(t,'status',['','No','Yes, time unknown','Unsure'],f.status||''));s+=es.map((e,i)=>eventEditor(t,e,i)).join('')+btn('＋ Add time manually','manual',t.id,'secondary wide');if(t.type==='timer')s+=`<div style="margin-top:12px">${box('Total minutes (manual override)',input(t,'minutes','number','Optional'))}</div>`}else if(t.type==='rating'){let v=num(f.value);s+=`<div class="row between"><strong id="rating-${t.id}">${esc(summary(t,f))}</strong>${btn('Clear','clearField',t.id,'ghost')}</div><input type="range" min="0" max="100" step="1" value="${v??50}" data-field="${t.id}" data-prop="value" aria-label="${esc(t.name)}"><div class="row between muted small"><span>${t.id==='quality'?'Terrible':t.id==='rest'?'Exhausted':'Low'}</span><span>${t.id==='quality'?'Wonderful':t.id==='rest'?'Refreshed':'High'}</span></div>`}else if(['choice','multi'].includes(t.type))s+=select(t,'value',['',...(t.options||['Yes','No','Unsure'])],f.value||'');else if(t.type==='number')s+=input(t,'value','number','Enter amount');else s+=`<textarea data-field="${t.id}" data-prop="value" placeholder="Optional observation">${esc(f.value||'')}</textarea>`;return s+`<div style="margin-top:12px">${box('Additional notes',`<textarea data-field="${t.id}" data-prop="note" placeholder="Optional">${esc(f.note||'')}</textarea>`)}</div>`+btn('Done','expand',t.id,'secondary wide')}
function tracker(t,morning=false){let f=field(t.id),s=summary(t,f),open=expanded.has(t.id),quick=!morning&&['time','timer','interrupt'].includes(t.type)&&t.id!=='sleep',live=t.type==='timer'&&events(f).some(e=>e.at&&!e.end);return `<div class="track"><div class="trackmain"><button class="tap" data-act="${quick?'quick':'expand'}" data-id="${t.id}"><span class="symbol">${esc(t.ico||'○')}</span><span class="flex"><span class="tracktitle">${esc(t.name)}</span><div class="tracked">${esc(s==='Not recorded'&&quick?t.type==='timer'?'Tap to start':'Tap to timestamp':s)}${live?' · Tap to stop':''}</div></span>${live?'■':s!=='Not recorded'?'✓':''}</button><button class="expand" aria-label="Edit ${esc(t.name)}" data-act="expand" data-id="${t.id}">${open?'⌃':'⌄'}</button></div>${open?`<div class="detail">${detail(t,f)}</div>`:''}</div>`}
function home(){return datebar()+`<div class="muted" style="margin:0 4px 12px">One tap, then put your phone away.</div>`+active().filter(t=>t.place!=='Morning').map(t=>tracker(t)).join('')+`<div style="margin-top:15px">${btn('Review morning log','nav','Morning','primary wide')}</div><div class="toast">${esc(message||'Changes save automatically.')}</div>`}
function recorded(t){let f=field(t.id);return summary(t,f)!=='Not recorded'||f.note||events(f).some(e=>e.note)}
function recapHtml(){let ts=db().trackers.filter(recorded);return `<div class="recap"><div class="muted small" style="letter-spacing:1px">FOR YOUR PAPER JOURNAL</div><h2 style="font:22px Georgia,serif;margin:7px 0;color:#40394b">${esc(pretty(selected))}</h2><div class="rule"></div>${ts.length?ts.map(t=>`<div class="row between" style="align-items:start;margin:8px 0"><span class="muted">${esc(t.name)}</span><strong style="text-align:right;max-width:60%">${esc(summary(t,field(t.id)))}</strong></div>${field(t.id).note?`<div class="small muted">${esc(field(t.id).note)}</div>`:''}${events(field(t.id)).filter(e=>e.note).map(e=>`<div class="small muted">${esc(e.note)}</div>`).join('')}`).join(''):'<div class="muted">Nothing recorded yet.</div>'}${record().notes?`<div class="rule"></div><p style="white-space:pre-wrap">${esc(record().notes)}</p>`:''}<div class="rule"></div><div class="muted" style="font-style:italic">The rest is yours to write.</div></div>`}
function morning(){let a=active(),mor=a.filter(t=>t.place==='Morning'||['wake','interrupt'].includes(t.id)),eve=a.filter(t=>!mor.includes(t));return datebar()+`<div class="section">Morning observations</div>`+mor.map(t=>tracker(t,true)).join('')+`<div class="section">From last night</div>`+eve.map(t=>tracker(t,true)).join('')+`<div class="panel"><label>Other observations (optional)</label><textarea data-notes="yes" placeholder="Anything worth remembering...">${esc(record().notes)}</textarea></div>${btn(recap?'Hide paper journal recap':'View paper journal recap','recap','','primary wide')}${recap?'<div id="recap-container" style="margin-top:10px">'+recapHtml()+'</div>':''}<div class="toast">No required fields. Edit whenever you like.</div>`}
const metrics={sleep:['Estimated sleep duration','min',600],window:['Sleep window','min',600],quality:['Sleep quality','rating',100],rest:['Restedness','rating',100],latency:['Time to fall asleep','min',60],interrupt:['Interruptions','number',4],scroll:['Scrolling duration','min',60],tv:['TV duration','min',60]};
function metricList(){let m={...metrics};db().trackers.filter(t=>!built.some(b=>b.id===t.id)&&t.stats!==false&&['rating','number','timer'].includes(t.type)).forEach(t=>m[t.id]=[t.name,t.type==='timer'?'min':t.type==='rating'?'rating':'number',t.type==='rating'?100:10]);return m}

function demoData(){let d=fresh();d.theme=state.theme;d.accent=state.accent;for(let i=0;i<35;i++){let k=shift(nightKey(),-i),p=shift(k,-1),f={},b=1350+i*13%75,a=b+15+i*7%30,s=a+12+i*9%31,w=450+i*11%60;function ts(m){let day=m>=1440?k:p,v=m%1440;return day+'T'+pad(Math.floor(v/60))+':'+pad(v%60)}function ev(m,approx=false){return {events:[{at:ts(m),approx,note:''}]}}f.bed=ev(b);f.attempt=ev(a);f.sleep=ev(s,true);f.wake=ev(1440+w);f.mag=ev(1260+i*7%60);f.quality={value:50+i*13%43};f.rest={value:45+i*17%50};f.interrupt=i%3===0?{status:'Yes',count:i%2+1,minutes:8+i%12}:{status:'None'};f.snack=i%3===1?ev(1324):{status:'No'};f.scroll=i%4?{minutes:10+i*7%40}:{status:'No'};f.tv={minutes:35+i%30};d.records[k]={fields:f,notes:''}}return d}

function updateRecap(){let e=$('recap-container');if(e)e.innerHTML=recapHtml()}
document.addEventListener('input',e=>{let el=e.target,p=el.dataset.prop,id=el.dataset.field;if(el.dataset.notes){record(selected,true).notes=el.value;persist();updateRecap();return}if(id&&p&&(el.tagName==='TEXTAREA'||['text','number','range'].includes(el.type))){let f=field(id,selected,true);f[p]=el.value;persist();if(el.type==='range'){let l=$('rating-'+id);if(l)l.textContent=summary(trackBy(id),f)}updateRecap()}if(el.dataset.event&&p&&el.type==='text'){let a=events(field(el.dataset.event,selected,true))[+el.dataset.index];if(a){a[p]=el.value;persist();updateRecap()}}});
document.addEventListener('change',async e=>{let el=e.target;if(el.id==='metric'){metric=el.value;render();return}if(el.id==='color'){db().accent=el.value;saveRender();return}if(el.id==='new-type'){$('options').hidden=el.value!=='multi';return}if(el.id==='import'){let f=el.files?.[0];if(f)try{restore(await f.text())}catch(err){alert('Could not read this file.')}return}if(el.dataset.toggle){let t=trackBy(el.dataset.toggle);if(t)t.on=el.checked;saveRender();return}if(el.dataset.event){if(el.type==='text'){updateRecap();return}let f=field(el.dataset.event,selected,true),a=events(f)[+el.dataset.index];if(a){a[el.dataset.prop]=el.type==='checkbox'?el.checked:el.value;if(a.at&&el.dataset.event!=='interrupt')delete f.status;persist();render()}return}if(el.dataset.field){if(el.tagName==='TEXTAREA'||['text','number'].includes(el.type)){updateRecap();return}let f=field(el.dataset.field,selected,true);f[el.dataset.prop]=el.value;if(el.dataset.field==='interrupt'&&el.dataset.prop==='status'&&el.value==='None'){delete f.count;delete f.minutes;f.events=[]}persist();render()}});
render();if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
